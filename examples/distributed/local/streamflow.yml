version: v1.0

workflows:
  hello-slurm:
    type: cwl
    config:
      file: main.cwl
      settings: inputs.yml
    bindings:
      - step: /step_1
        target:
          deployment: local
      - step: /step_2
        target:
          deployment: slurm
          service: broadwell
      - step: /step_3
        target:
          deployment: local

deployments:
  local:
    workdir: /tmp
    type: local
    config: {}
  slurm:
    type: unito.slurmrest
    # workdir: /beegfs/home/tommaso.fogliobonda/streamflow
    workdir: <PATH_TO_WORKDIR>  # e.g., /beegfs/home/<user>/.streamflow
    config:
      api_address: "https://api.slurm.hpc4ai.unito.it"
      jwt_token: "<PATH_TO_JWT_TOKEN_FILE>"
      services:
        broadwell:
          environment:
          # PATH should include the path to slurm binaries
            - "PATH=/usr/local/bin:/usr/bin:/bin:/usr/local/sbin:/usr/sbin:/sbin:/opt/slurm/bin"
          partition: "broadwell"