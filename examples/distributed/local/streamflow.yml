version: v1.0

workflows:
  hello-slurm:
    type: cwl
    config:
      file: main.cwl
      settings: inputs.yml
    bindings:
      - step: /step_1
        target:
          deployment: local
      - step: /step_2
        target:
          deployment: slurm
          service: broadwell
      - step: /step_3
        target:
          deployment: local

deployments:
  local:
    workdir: /tmp
    type: local
    config: {}
  slurm:
    type: unito.slurmrest
    workdir: /beegfs/home/dmedic/sogei-gh02/Sogei-DevOps-pipeline/unito-pipeline/prova_streamflow
    config:
      api_address: "https://api.slurm.hpc4ai.unito.it"
      jwt_token: "<YOUR_JWT_TOKEN>" # can be "env:[ENV_VAR_NAME]" or "file:[PATH_TO_FILE]" or direct token
      services:
        broadwell:
          environment:
            - "PATH=/usr/local/bin:/usr/bin:/bin:/usr/local/sbin:/usr/sbin:/sbin:/opt/slurm/bin"
          partition: "broadwell"