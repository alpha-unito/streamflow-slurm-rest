version: v1.0

workflows:
  hello-slurm:
    type: cwl
    config:
      file: main.cwl
    bindings:
      - step: /
        target:
          deployment: slurm-deployment
          service: test-service

deployments:
  ssh-deployment:
    type: ssh
    workdir: /path/to/workdir
    config:
      nodes:
        - <ssh-host>
      username: <ssh-username>
      sshKey: /path/to/ssh/key
      checkHostKey: false

  slurm-deployment:
    type: unito.slurmrest
    config:
      api_address: <slurm-api-address>
      jwt_token: "/path/to/jwt"
      services:
        test-service:
          partition: <partition-name>
    wraps: ssh-deployment